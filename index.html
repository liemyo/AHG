<script>/* phones: whole app at 81% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */

try { const t = JSON.parse(localStorage.getItem('ahg.theme') || '{}'); if (t.mode && t.mode !== 'auto') document.documentElement.dataset.theme = t.mode; if (t.accent) document.documentElement.style.setProperty('--acc', t.accent); } catch {}</script>
<title>Virtual Work AHG</title>
<meta name="description" content="Virtual Work AHG — reminder, global chat, task dan kasbon tim, sinkron real time di HP dan laptop.">
<meta name="theme-color" content="#1f6fc0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231f6fc0'/><text x='50' y='63' font-family='Arial' font-weight='700' font-size='34' fill='white' text-anchor='middle'>AHG</text></svg>">
<style>:root{--acc:#1f6fc0;--ahg-blue:#1f6fc0;--ahg-red:#d62b2b;--bg:#f4f6f5;--card:#fff;--soft:#eef1ef;--line:#dfe4e1;--text:#16191a;--muted:#5f6b67;--red:#d93d42;--green:#15803d;--warn:#b45309;--na:60%;--shadow:0 1px 2px rgba(10,30,20,.05),0 4px 14px rgba(10,30,20,.05);--acc-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1312;--card:#181d1c;--soft:#212826;--line:#2c3532;--text:#eef3f1;--muted:#9fb0aa;--red:#ff6b70;--green:#4ade80;--warn:#fbbf24;--na:26%;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1312;--card:#181d1c;--soft:#212826;--line:#2c3532;--text:#eef3f1;--muted:#9fb0aa;--red:#ff6b70;--green:#4ade80;--warn:#fbbf24;--na:26%;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
input:disabled,select:disabled,textarea:disabled{opacity:.75}
textarea{resize:vertical}
a{color:var(--acc)}
h1,h2,h3{letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.danger-f{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px;font-size:16px}
.btn.in-b{color:var(--green)}.btn.out-b{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:13px}
.err{color:var(--red);font-weight:600;min-height:1.2em;margin:0;font-size:14px}
.warn-t{color:var(--warn);font-weight:600}
.ib{border:0;background:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;color:var(--muted);padding:0;flex:none}
.ib:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.ib.on{color:#f0a020}
.ib.big{font-size:26px;width:40px;height:40px;color:var(--text)}
.ib.sm{width:26px;height:26px;font-size:13px}
.mini{border:0;background:none;color:var(--acc);font-weight:700;font-size:12px;cursor:pointer;padding:0 4px}
.sp{flex:1}
.full{width:100%}
.chk-l{display:flex!important;align-items:center;gap:8px;flex-direction:row!important;font-weight:500!important;cursor:pointer}
.chk-l input{width:18px;height:18px;accent-color:var(--acc)}
/* avatars */
.av{--av:#1a8566;width:32px;height:32px;border-radius:50%;background:var(--av);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none;line-height:1}
.av.xs{width:18px;height:18px;font-size:10px;vertical-align:-4px}
.av.xl{width:56px;height:56px;font-size:24px}
.av.gl{background:color-mix(in srgb,var(--acc) 18%,var(--card));font-size:16px}
.avw{position:relative;display:inline-flex;flex:none}
.st{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#9aa5a1;border:2px solid var(--card)}
.st.on{background:#22c55e}
.on-t{color:#16a34a;font-weight:700}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--ahg-blue) 22%,transparent),transparent),radial-gradient(700px 400px at 110% 110%,color-mix(in srgb,var(--ahg-red) 14%,transparent),transparent),var(--bg)}
.lcard{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.lcard label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.lcard input{padding:11px 13px;font-size:16px}
.lbrand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:6px}
.lbrand h1{margin:8px 0 0;font-size:24px}.lbrand p{margin:0;font-size:14px}

.ahg-logo.big{width:190px;height:150px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.18))}
.ahg-logo.hdr{width:46px;height:36px}
.lcard{border-top:4px solid var(--ahg-blue)}
.pw{display:flex;align-items:center;gap:4px}.pw input{flex:1}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.02em;flex:none}
.logo.big{width:56px;height:56px;border-radius:16px;font-size:18px}
/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "side main users";min-height:100dvh}
.top{grid-area:top;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:8px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.clock{display:flex;flex-direction:column;line-height:1.15;min-width:190px}
.clock b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--acc)}
.clock span{font-size:12.5px;color:var(--muted);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin:0 auto 0 0}
.top-r{display:flex;align-items:center;gap:12px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--warn)}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600}
.me-btn:hover{background:var(--soft)}
.me-btn small{font-size:10.5px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:99px;padding:1px 6px;margin-left:2px}
.caret{color:var(--muted);font-size:12px}
.side{grid-area:side;position:sticky;top:61px;align-self:start;height:calc(100dvh - 61px);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text);font-weight:600;font-size:15px}
.nav:hover{background:var(--soft)}
.nav.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.nav .ic{width:22px;text-align:center;font-size:18px}
.nav .lb{flex:1}
.n{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;background:var(--soft);color:var(--muted)}
.n.hot{background:var(--red);color:#fff}
.n.grn{background:color-mix(in srgb,#22c55e 20%,transparent);color:#16a34a}
.side-f{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:2px}
.nv-users{display:none}
main{grid-area:main;min-width:0;padding:18px 24px 100px}
.upanel{grid-area:users;position:sticky;top:61px;align-self:start;height:calc(100dvh - 61px);overflow:auto;border-left:1px solid var(--line);padding:14px 12px}
.up-h{display:flex;flex-direction:column;padding:2px 6px 10px}
.up-h b{font-size:15px}
.up-f{padding:6px}
.ulist{display:flex;flex-direction:column;gap:2px}
.ulist.big{padding:6px}
.urow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer}
.urow:hover{background:var(--soft)}
.urow.me{cursor:default;background:none}
.ui{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.ui b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui small{font-size:12px;color:var(--muted)}
.ui small b,.adm{font-size:10.5px}
.adm{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:99px;padding:1px 6px}
.wh-ic{opacity:0;font-size:14px}
.urow:hover .wh-ic{opacity:.8}
.bnav{display:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font-size:24px}
.hc{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);margin:36px 10px}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;text-align:center;text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
.tl:hover{transform:translateY(-2px);border-color:var(--acc)}
.tl-ic{width:64px;height:64px;margin-bottom:4px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.tl b{font-size:16px}
@media (max-width:600px){.tl-grid{grid-template-columns:repeat(2,1fr);gap:10px}.tl{padding:16px 8px}.tl-ic{width:52px;height:52px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--text)}
.chip small{color:var(--muted);font-weight:700}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc)}
.chip-sel{border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
/* reminder */
.hb-tog{display:flex;align-items:center;width:100%;border:0;background:none;cursor:pointer;padding:6px 0;margin:0 0 10px;color:var(--muted)}
.hb-tog::before,.hb-tog::after{content:'';flex:1;height:1px;background:var(--line)}
.hb-tog span{padding:0 14px;font-size:18px;line-height:1;font-weight:700}
.hb-tog:hover{color:var(--acc)}
.hb-tog:hover::before,.hb-tog:hover::after{background:color-mix(in srgb,var(--acc) 50%,var(--line))}
.cal{padding:12px 14px 14px;margin-bottom:14px}
.cal-h{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.cal-t{display:flex;gap:6px}
.cal-t select{font-weight:700;font-size:16px;border-color:transparent;background:var(--soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-g.wk span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-g.wk span:last-child{color:var(--red)}
.day{position:relative;min-height:96px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;color:var(--text);overflow:hidden;min-width:0}
.day:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.day.out{opacity:.45}
.day.sun .dn{color:var(--red)}
.day .dn{font-weight:700;font-size:13.5px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--acc);color:#fff}
.day.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.dots{display:none;gap:3px;flex-wrap:wrap;align-items:center;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dots i.dn-ok{background:none;border:1.5px solid var(--c)}
.dots em{font-size:9px;font-style:normal;color:var(--muted);font-weight:700}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{font-size:11.5px;line-height:1.3;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.ok{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);font-weight:600}
.qadd{display:grid;grid-template-columns:minmax(0,2.2fr) 150px 110px 120px minmax(0,1.6fr) auto;gap:8px;padding:10px;margin-bottom:14px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{--c:#3b82f6;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.rrow.done{opacity:.72}
.rrow.done .rt{text-decoration:line-through}
.rchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:none;cursor:pointer;flex:none;color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;margin-top:1px}
.rrow.done .rchk{background:var(--c)}
.rb{flex:1;min-width:0}
.rt{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.rn{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:color-mix(in srgb,var(--text) 82%,transparent);margin-top:2px}
.rm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.rm b{color:var(--text)}
.due{font-weight:700;color:var(--text)}
.due.late{color:var(--red)}
.okm{color:var(--green)}
.ra{display:flex;gap:0}
/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(860px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,15,10,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.dlg h3{margin:0 0 6px;font-size:15px}
.dlg label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
.dlg p{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.swatches,.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw{cursor:pointer;display:inline-flex!important}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid color-mix(in srgb,var(--text) 15%,transparent);display:block}
.sw.note i[style*=transparent]{background:linear-gradient(135deg,transparent 45%,var(--red) 46%,var(--red) 54%,transparent 55%)}
.sw input:checked+i{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{flex:1;display:block!important;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:9px 6px;font-weight:700}
.seg input:checked+span{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.seg input:checked+span.in{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.seg input:checked+span.out{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.ed-bar{display:flex;align-items:center;gap:4px}
.ed-bar b{font-size:16px}
/* chat */
.chat{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;height:calc(100dvh - 61px - 36px - 40px)}
main[data-view=chat]{padding-bottom:18px}
.convs{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.cv-h{padding:12px 14px 6px}
.cv-l{flex:1;overflow:auto;padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.conv{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text)}
.conv:hover{background:var(--soft)}
.conv.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.cn{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cn small{font-weight:500;color:var(--muted);font-size:11.5px}
.cv-new{display:flex;flex-direction:column;gap:4px;padding:10px;border-top:1px solid var(--line);font-weight:700;font-size:12.5px}
.cpane{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.c-h{display:flex;flex-direction:column;padding:10px 16px;border-bottom:1px solid var(--line)}
.c-h b{font-size:16px}
.m-conv{display:none}
.c-list{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--soft) 50%,var(--card))}
.c-list .more{align-self:center;margin-bottom:8px}
.dsep{text-align:center;margin:12px 0 6px}
.dsep span{font-size:12px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(680px,88%);margin-top:6px}
.msg.cont{margin-top:0}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.mav{width:32px;flex:none}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:7px 11px 5px;min-width:0;box-shadow:var(--shadow)}
.msg.mine .bub{background:color-mix(in srgb,var(--acc) 14%,var(--card));border-color:color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:16px 16px 4px 16px}
.msg.wh .bub{border-style:dashed;border-color:#8b5cf6;background:color-mix(in srgb,#8b5cf6 9%,var(--card))}
.mh{font-size:12.5px;margin-bottom:1px}
.whl{color:#8b5cf6;font-weight:700;font-size:11.5px}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.mdel{border:0;background:none;cursor:pointer;font-size:11px;opacity:0;padding:0}
.msg:hover .mdel{opacity:.7}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.att-img{border:0;padding:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden}
.att-img img{display:block;max-width:240px;max-height:200px;border-radius:10px}
.att-file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;max-width:280px;color:var(--text)}
.att-file:hover{border-color:var(--acc)}
.fi{font-size:22px}
.fn{display:flex;flex-direction:column;font-size:13px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.fn small{font-weight:500;color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.composer.whm{background:color-mix(in srgb,#8b5cf6 7%,var(--card))}
.wh-bar{font-size:12.5px;color:#7c3aed;font-weight:600}
.pend{display:flex;flex-wrap:wrap;gap:6px}
.mention{font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:6px;padding:0 4px}
.mention.me{color:#b45309;background:color-mix(in srgb,#f59e0b 22%,transparent)}
.msg.ment .bub{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b}
.composer{position:relative}
.mpop{position:absolute;left:10px;right:10px;bottom:calc(100% - 4px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px;display:flex;flex-direction:column;max-height:300px;overflow:auto}
.mpop[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 8px;border-radius:9px;cursor:pointer;text-align:left;color:var(--text)}
.mi span:last-child{display:flex;flex-direction:column;line-height:1.25}
.mi small{color:var(--muted);font-size:12px}
.mi.on,.mi:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.ib.at{font-weight:800;font-size:18px}
.pend:empty{display:none}
.pf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 6px;font-size:12.5px;background:var(--card);max-width:100%}
.pf img{width:30px;height:30px;object-fit:cover;border-radius:6px}
.pf .ib{width:24px;height:24px;font-size:12px}
.c-row{display:flex;align-items:flex-end;gap:4px}
.c-row textarea{flex:1;resize:none;max-height:160px;min-height:40px;border-radius:12px;padding:9px 12px;line-height:1.4}
.attach{cursor:pointer}
.send{height:40px}
/* task */
.links{padding:4px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.links.open{padding-bottom:12px}
.lk-h{display:flex;gap:10px;align-items:center;border:0;background:none;color:var(--text);cursor:pointer;padding:8px 0;font-size:14.5px;text-align:left}
.lk-h .tg{font-size:17px;font-weight:700;color:var(--muted)}
.lk-l{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--soft);max-width:100%}
.lk a{display:inline-flex;align-items:center;gap:6px;padding:5px 4px 5px 10px;text-decoration:none;color:var(--text);font-weight:600;font-size:13px;min-width:0}
.lk a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.lk img{width:16px;height:16px;border-radius:3px}
.lk .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 9px 0 4px;font-size:12px}
.lk:hover{border-color:var(--acc)}
.lk-add{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}
.ttabs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.tf{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.tf .t-q{flex:1}
.t-tab{font-weight:700}
.quick{width:100%;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 16px;display:flex;align-items:center;color:var(--muted);cursor:text;font-weight:600;text-align:left}
.quick span{margin-left:auto;font-size:18px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:stretch}
.grid.list{grid-template-columns:1fr;gap:8px}
.ncard{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden}
.ncard:hover{border-color:color-mix(in srgb,var(--text) 25%,transparent)}
.ncard.col{background:color-mix(in srgb,var(--nc) var(--na),var(--card));border-color:transparent}
.ncard.st-done h3{text-decoration:line-through;opacity:.7}
.nh{display:flex;align-items:flex-start;gap:6px}
.nh h3{margin:2px 0 6px;font-size:15.5px;flex:1;overflow-wrap:anywhere;line-height:1.35}
.nh .ib{width:28px;height:28px;margin:-4px -6px 0 0;font-size:19px}
.nb{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:color-mix(in srgb,var(--text) 85%,transparent);max-height:12em;overflow:hidden}
.ro-body{max-height:none;padding:4px 0}
.cl{display:flex;flex-direction:column;gap:1px;font-size:14px;margin-top:4px}
.cli{display:flex;gap:6px;align-items:flex-start}
.cli.dn span:last-child{text-decoration:line-through;color:var(--muted)}
.cb{border:0;background:none;padding:0;cursor:pointer;font-size:15px;line-height:1.4;color:var(--muted)}
.tlink{display:inline-flex;align-self:flex-start;margin-top:6px;font-size:13px;font-weight:700;text-decoration:none;background:color-mix(in srgb,var(--acc) 12%,transparent);padding:3px 10px;border-radius:99px}
.nf{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.stb{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.stb.st-doing{color:#b45309;border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 14%,var(--card))}
.stb.st-done{color:var(--green);border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}
.tag{background:color-mix(in srgb,var(--text) 8%,transparent);border-radius:99px;padding:1px 8px;font-weight:600}
.tag.late{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.who{font-weight:700;color:var(--acc)}
.routine{padding:12px 14px}
.rt-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-h>div{display:flex;flex-direction:column;line-height:1.3}
.prog{height:6px;border-radius:99px;background:var(--soft);margin:10px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.tbl-wrap{overflow-x:auto}
.rtbl{width:100%;border-collapse:collapse;min-width:640px}
.rtbl th,.rtbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
.rtbl thead th{font-size:12.5px;color:var(--muted)}
.rtbl thead th small{display:block;font-weight:500}
.rtbl tbody th,.rtbl thead th:first-child{text-align:left;min-width:180px}
.rtbl tbody th small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.rtbl td small{display:block;font-size:10.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.rtbl .td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.rtbl td.na{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--text) 5%,transparent) 6px 7px)}
.rck{width:30px;height:30px;border-radius:9px;border:2px solid color-mix(in srgb,var(--acc) 60%,var(--line));background:var(--card);cursor:pointer;color:#fff;font-weight:900;font-size:16px}
.rck.on{background:var(--acc);border-color:var(--acc)}
.rck.miss{border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.linkish{border:0;background:none;padding:0;cursor:pointer;font-weight:700;color:var(--text);text-align:left;font-size:14px}
.linkish:hover{color:var(--acc)}
.ted{gap:10px}
.ted.col,dialog:has(.ted.col){background:color-mix(in srgb,var(--nc) var(--na),var(--card))}
.e-title{border:0!important;background:none!important;font-size:22px;font-weight:700;padding:4px 0;outline:0!important}
.e-body{border:0!important;background:none!important;min-height:110px;padding:4px 0;font-size:15.5px;line-height:1.55;outline:0!important;resize:vertical}
.cl-ed{display:flex;flex-direction:column;gap:4px}
.cli-ed{display:flex;align-items:center;gap:6px}
.cli-ed .tf-d{width:18px;height:18px;accent-color:var(--acc);flex:none}
.cli-ed .tf-t{flex:1;background:color-mix(in srgb,var(--card) 60%,transparent)}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tgrid input,.tgrid select{background:color-mix(in srgb,var(--card) 70%,transparent)}
.rt-box{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.days-pick{display:flex;gap:6px;flex-wrap:wrap}
.days-pick label{display:block!important;cursor:pointer}
.days-pick input{position:absolute;opacity:0}
.days-pick span{display:block;padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-weight:700;font-size:13px;background:var(--card)}
.days-pick input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.cmts{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
#cm-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;max-height:340px;overflow:auto}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt>div{flex:1;min-width:0;background:color-mix(in srgb,var(--soft) 80%,transparent);border-radius:12px;padding:7px 11px}
.ch{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ch b{font-size:13.5px}
.ct{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.cm-add{display:flex;gap:8px;align-items:flex-end}
.cm-add textarea{flex:1}
/* cash */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.kcard{--c:#16a34a;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);color:var(--text);min-width:0}
.kcard:hover{border-color:var(--c)}
.kcard.on{box-shadow:0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 7%,var(--card))}
.kh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kh b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ks{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.ks.neg{color:var(--red)}
.kl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kio{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;font-weight:700;margin-top:6px}
.in{color:var(--green)}.out{color:var(--red)}
.kn{font-size:12px;color:var(--muted);margin-top:4px}
.kcard.add{border-style:dashed;border-top-width:1px;align-items:center;justify-content:center;text-align:center;box-shadow:none;background:none;min-height:120px}
.kcard.add .plus{font-size:28px;color:var(--acc);line-height:1}
.cflt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;margin-bottom:10px}
.cflt input#c-q{flex:1;min-width:160px}
.pnav{display:inline-flex;align-items:center;gap:2px;font-size:14px}
.csum{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;font-weight:600;padding:2px 4px 10px}
.txl{display:flex;flex-direction:column;gap:12px}
.txd{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.txh{display:flex;justify-content:space-between;padding:8px 14px;background:var(--soft);font-size:13.5px}
.tx{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.tx.ed{cursor:pointer}
.tx.ed:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.txh+.tx{border-top:0}
.tic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}
.tic.in{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.tic.out{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.ti{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- WAITING (game) ---------- */
.gm button *{pointer-events:none}
.gm .gm-tabs{gap:6px;display:flex;flex-wrap:wrap}
.gm-bar{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.gm-pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.ok-t{color:var(--green)}
.gm h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gm h4{margin:14px 0 4px;font-size:14px}
.gm-menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.gm-card{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;cursor:pointer;color:var(--text);font:inherit}
.gm-card:hover{border-color:var(--acc)}
.gm-card.pet{background:linear-gradient(135deg,color-mix(in srgb,#ec4899 12%,var(--card)),var(--card))}
.gm-card.farm{background:linear-gradient(135deg,color-mix(in srgb,#16a34a 14%,var(--card)),var(--card))}
.gm-art{font-size:54px;line-height:1;flex:none}
.gm-ct{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.gm-ct small{color:var(--muted)}
.gm-st{font-size:13px}
.gm-lb{padding:14px 16px}
.lb-r{display:flex;align-items:center;gap:9px;padding:7px 4px;border-top:1px solid var(--line)}
.lb-r.me{background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:10px}
.lb-n{width:26px;text-align:center;font-weight:800}
.lb-u{flex:1;min-width:0;display:flex;flex-direction:column}
.lb-u small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-s{font-size:16px;color:var(--acc)}
.gm-pets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gm-pet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px}
.gm-stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px;min-height:300px;overflow:hidden;
  background:radial-gradient(130% 34% at 50% 100%,color-mix(in srgb,#16a34a 30%,var(--card)) 0 70%,transparent 71%),linear-gradient(180deg,color-mix(in srgb,#38bdf8 18%,var(--card)),var(--card))}
.gm-stage.night{background:radial-gradient(130% 34% at 50% 100%,color-mix(in srgb,#16a34a 18%,#0f172a) 0 70%,transparent 71%),linear-gradient(180deg,#1e293b,#0f172a);color:#e2e8f0}
.gm-stage.night .muted{color:#94a3b8}
.gm-bub{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600;position:relative;margin-bottom:8px;max-width:90%;text-align:center}
.gm-bub:after{content:'';position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.gm-petbig{line-height:1.1;animation:gm-idle 2.4s ease-in-out infinite;user-select:none}
.gm-petbig.s0{font-size:70px;animation:gm-egg 1.2s ease-in-out infinite}
.gm-petbig.s1{font-size:72px}.gm-petbig.s2{font-size:92px}.gm-petbig.s3{font-size:112px}
.gm-petbig.zz{animation:gm-zz 3s ease-in-out infinite;opacity:.85}
.gm-petbig.play{animation:gm-jump .4s ease-in-out 3}
.gm-petbig.eat{animation:gm-eat .3s ease-in-out 3}
.gm-petbig.bath{animation:gm-shake .2s linear 6}
@keyframes gm-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gm-egg{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes gm-zz{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes gm-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px) rotate(8deg)}}
@keyframes gm-eat{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.9)}}
@keyframes gm-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gm-mood{font-size:26px;min-height:34px}
.gm-name{text-align:center}
.gm-stats{padding:14px 16px}

.gm-field{padding:14px}

.plot{position:relative;height:104px;width:100%;min-width:0;border:0;border-radius:12px;background:#a16207;background:color-mix(in srgb,#a16207 70%,var(--card));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;padding:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}

.gm-barn,.gm-shop{padding:14px 16px}

<script>// ---------- Excel (.xlsx) + PDF writers (from Saku.yuk, no libraries) ----------

  _crc: null,

  col: i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; },
  x: s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ''),

  // style ids: 0 normal, 1 bold, 2 #,##0, 3 bold #,##0, 4 date+time, 5 0.0%, 6 title, 7 date
  cell(v, ref) {
    const o = v !== null && typeof v === 'object' && !(v instanceof Date) ? v : { v }; let val = o.v; let st = o.s ?? 0;

  sheet(rows, widths = []) {

      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="dd/mm/yyyy hh:mm"/><numFmt numFmtId="165" formatCode="0.0%"/><numFmt numFmtId="166" formatCode="dd/mm/yyyy"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: XLSX.sheet(s.rows, s.widths) }))];
    return XLSX.zip(files);
  }

// Minimal PDF writer (A4, Helvetica, WinAnsi) — produces a real downloadable .pdf without libraries.
const PDF = {
  HW: [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
  WIN: { 0x2013: 0x96, 0x2014: 0x97, 0x2018: 0x91, 0x2019: 0x92, 0x201c: 0x93, 0x201d: 0x94, 0x2022: 0x95, 0x2026: 0x85, 0x20ac: 0x80, 0x2212: 0x2d },
  codes(str) { const out = []; for (const ch of String(str ?? '')) { const c = ch.codePointAt(0); if (c >= 32 && c < 127) out.push(c); else if (c >= 160 && c < 256) out.push(c); else if (PDF.WIN[c]) out.push(PDF.WIN[c]); else if (c === 9 || c === 10 || c === 13) out.push(32); else out.push(63); } return out; },

  fit(str, size, max, bold) { str = String(str ?? ''); if (PDF.width(str, size, bold) <= max) return str; let s = str; while (s.length && PDF.width(s + '…', size, bold) > max) s = s.slice(0, -1); return s + '…'; },
  doc() {
    const W = 595.28, H = 841.89; const pages = []; let cur = null;

    const d = {
      W, H, get page() { return pages.length; },
      add() { cur = []; pages.push(cur); return d; },
      text(x, y, str, size = 10, o = {}) { const cs = PDF.codes(str); const w = PDF.width(str, size, o.bold); if (o.align === 'right') x -= w; else if (o.align === 'center') x -= w / 2;

      build() {
        const objs = []; const add = s => { objs.push(s); return objs.length; };

      }
    };

  }

// Waktu berjalan nyata: pet lapar/kotor/ngantuk seiring jam, tanaman tumbuh hanya selama tanah basah (disiram / hujan).
const PETS = { kucing: ['Kucing', '🐱', '🐱', '🐈'], anjing: ['Anjing', '🐶', '🐶', '🐕'], kelinci: ['Kelinci', '🐰', '🐰', '🐇'], hamster: ['Hamster', '🐹', '🐹', '🐹'], ayam: ['Anak ayam', '🐣', '🐥', '🐓'], panda: ['Panda', '🐼', '🐼', '🐼'], penguin: ['Penguin', '🐧', '🐧', '🐧'], naga: ['Naga', '🦎', '🐲', '🐉'] };

const CROPS = { sawi: ['Sawi', '🥬', 3, 8, 16, 1], wortel: ['Wortel', '🥕', 5, 12, 26, 1], kentang: ['Kentang', '🥔', 7, 16, 36, 2], tomat: ['Tomat', '🍅', 9, 20, 46, 2], jagung: ['Jagung', '🌽', 12, 25, 60, 3], terong: ['Terong', '🍆', 15, 30, 74, 4], stroberi: ['Stroberi', '🍓', 20, 40, 104, 5], semangka: ['Semangka', '🍉', 30, 55, 150, 6], labu: ['Labu', '🎃', 45, 75, 220, 7] };
// pet food: name, emoji, price (0 = gratis tanpa batas), effects
const FOODS = { pakan: ['Pakan biasa', '🍚', 0, { hunger: 18 }], susu: ['Susu', '🥛', 8, { hunger: 15, happy: 6, energy: 5 }], ikan: ['Ikan', '🐟', 12, { hunger: 30, happy: 8 }], kue: ['Kue', '🍰', 15, { hunger: 12, happy: 18 }] };

const cropFeed = k => { const m = CROPS[k][2]; return { hunger: Math.min(45, 10 + Math.round(m * 1.2)), happy: 4 + Math.floor(m / 5) }; };
const clamp = v => Math.max(0, Math.min(100, v));
const lvlOf = (xp, k) => Math.floor(Math.sqrt((xp || 0) / k)) + 1;
const petLvl = p => lvlOf(p.xp, 8), farmLvl = G => lvlOf(G.fxp, 10);

const petEmoji = (p, now) => { const s = petStage(p, now); return s ? PETS[p.sp][s] : '🥚'; };
const dayHash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const rainy = (d = today()) => dayHash('ahg-cuaca-' + d) % 4 === 0; // cuaca sama untuk semua anggota
const weather = () => rainy() ? ['🌧', 'Hujan — kebun tersiram otomatis'] : dayHash('awan' + today()) % 3 ? ['☀️', 'Cerah'] : ['⛅', 'Berawan'];
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}j ${m}m` : `${m}:${pad(s % 60)}`; };

function newGame() {

}
const W = { G: null, owner: '', tab: 'menu', seed: 'sawi', dig: false, shop: false, feed: false, anim: null, saveT: null, tick: 0 };
function gameG() { // my game state; a newer copy saved from another device wins

// stats now, from the last settled state (linear in time, so settling at any moment gives the same result)
function petNow(p, now = Date.now()) {
  const from = Math.max(p.t, p.born + HATCH_MS); if (now <= from) return { ...p };
  const h = (now - from) / 3.6e6, q = { ...p };

  else { q.hunger -= 9 * h; q.happy -= (q.sick ? 18 : 6) * h; q.clean -= 4 * h; q.energy -= 5 * h; }
  for (const k of ['hunger', 'happy', 'clean', 'energy']) q[k] = clamp(q[k]);

}
function plotNow(pl, now = Date.now()) {

  const need = CROPS[pl.c][2] * 60e3, wetEnd = rainy() ? now : Math.min(now, pl.w || 0);

const ripe = pl => pl.c && pl.g >= CROPS[pl.c][2] * 60e3;

  if (p.clean < 35) l.push('Badanku kotor 🛁');

  if (p.happy < 35) l.push('Ayo main! 🎾');

}
const petMood = p => p.sick ? '🤒' : p.sleep ? '😴' : (a => a >= 75 ? '😄' : a >= 50 ? '🙂' : a >= 30 ? '😐' : '😢')((p.hunger + p.happy + p.clean + p.energy) / 4);

  const rows = [...m.values()].sort((a, b) => a.bc.localeCompare(b.bc) || a.unit.localeCompare(b.unit) || a.mcat.localeCompare(b.mcat) || a.item.localeCompare(b.item));

function confirmDlg(html, ok = 'Ya', danger = true, extra = '') { // resolves on the button click itself (the dialog 'close' event can be deferred)
  return new Promise(res => {
    const d = $('#cfm'); let done = false;
    const end = v => { if (done) return; done = true; if (d.open) d.close(); res(v ? { ok: true, form: d } : null); };
    d.innerHTML = `<form class="dlg"><p>${html}</p>${extra}<div class="dlg-f"><span class="sp"></span><button type="button" class="btn" data-v="no">Batal</button><button type="submit" class="btn ${danger ? 'danger-f' : 'primary'}">${ok}</button></div></form>`;

  repPdf: () => reportPdf(), repXlsx: () => reportXlsx(), repPrint: () => reportPrint(),

  admReset: async el => { const n = el.dataset.u; if (await confirmDlg(`Reset password <b>${esc(n)}</b>? User akan keluar dari semua perangkat; login berikutnya dengan password apa pun menjadi password barunya.`, 'Reset')) adminAct('reset', n); },

};

  unitCat: el => { S.unit.cat = el.value; renderMain(); }, unitP: el => { S.unit.p = el.value; S.unit.ref = today(); renderMain(); },

  unitBc: el => { S.unit.bc = el.value; renderMain(); }, unitU: el => { S.unit.u = el.value; renderMain(); },
  unitQ: (el, ev) => { if (ev.type === 'input') { S.unit.q = el.value; renderMain(); } },

  ufUnit: el => { const v = el.value, pu = prodUnits(); $('#uf-unit-new').hidden = v !== '+'; $('#uf-pcp').hidden = v !== 'PCP'; $('#uf-sat').textContent = v === '+' ? '' : (pu[v]?.sat || ''); if (v === '+') $('#uf-un-name').focus(); },
  sfBc: el => { $('#sf-bc-new-l').hidden = el.value !== '+'; if (el.value === '+') $('#sf-bc-new').focus(); },
  sfMc: el => { $('#sf-mc-new-l').hidden = el.value !== '+'; if (el.value === '+') $('#sf-mc-new').focus(); },
  sfSat: el => { $('#sf-sat-new-l').hidden = el.value !== '+'; if (el.value === '+') $('#sf-sat-new').focus(); },
  unitMk: el => { S.unit.mk = el.value; renderMain(); },
  ufSize: el => { $('#uf-size-new-l').hidden = el.value !== '+'; if (el.value === '+') $('#uf-size-new').focus(); },
  repCat: el => { S.rep.cat = el.value; repRefresh(); }, repP: el => { S.rep.p = el.value; S.rep.ref = today(); repRefresh(); },
  repRef: el => { const v = el.value; if (!v) return; S.rep.ref = S.rep.p === 'month' ? v + '-01' : S.rep.p === 'year' ? (v.length === 4 ? v + '-01-01' : S.rep.ref) : v; repRefresh(); },
  repFrom: el => { S.rep.from = el.value; repRefresh(); }, repTo: el => { S.rep.to = el.value; repRefresh(); },
  tfColor: el => { const f = $('#task-form'), c = NOTE_COLORS[el.value]?.[1]; f.classList.toggle('col', !!el.value); f.style.setProperty('--nc', c || 'transparent'); },
  thMode: el => setTheme({ mode: el.value }), thAcc: el => setTheme({ accent: el.value }), thScale: el => setTheme({ scale: Number(el.value) }),
  npSound: el => LS.set('notify', JSON.stringify({ ...notifyPref(), sound: el.checked })),
  npRem: el => LS.set('notify', JSON.stringify({ ...notifyPref(), rem: el.value })),
  npBrowser: async el => {
    if (el.checked) {
      if (!('Notification' in window)) { toast('Browser ini tidak mendukung notifikasi.', 'warn'); el.checked = false; return; }
      const p = await Notification.requestPermission(); if (p !== 'granted') { toast('Izin notifikasi ditolak browser.', 'warn'); el.checked = false; return; }

};
function repRefresh() { const b = $('#rep-body'); if (b) b.innerHTML = reportBody(); }
async function pickUser(list) {
  const r = await confirmDlg('🤫 Whisper ke siapa?', 'Mulai whisper', false, `<select id="pk-user" class="full">${list.map(u => `<option value="${esc(u.name)}">${esc(uname(u.name))} (@${esc(u.name)})</option>`).join('')}</select>`);
  const v = r ? $('#pk-user').value : ''; if (v) { S.chat.conv = 'w:' + v; markRead(); } renderMain(); renderNav();
}

// ---------- events ----------
document.addEventListener('click', ev => {
  if (M.open && !ev.target.closest('.mpop') && ev.target.id !== M.id) mentionClose();
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'A' && el.dataset.a === 'stop') return;
  const a = ev.target.closest('a[href]'); if (a && a !== el && el.contains(a)) return; // links inside cards open normally
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.closest('.ncard') && el !== el.closest('.ncard')) ev.stopPropagation();
  ev.preventDefault(); fn(el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches?.('.ncard')) A.taskOpen(ev.target);
  if (M.open && ev.target.id && ev.target.id === M.id && mentionKey(ev)) return;
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.target.id === 'c-text' && !matchMedia('(pointer:coarse)').matches) { ev.preventDefault(); sendMsg(); }
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.id === 'cm-text') { ev.preventDefault(); $('[data-a=cmtAdd]')?.click(); }
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.id?.startsWith('rc-')) { ev.preventDefault(); $(`[data-a=remCmAdd][data-id="${ev.target.id.slice(3)}"]`)?.click(); }
});
document.addEventListener('input', ev => { if (ev.target.matches?.('[data-men]') && ev.target.id) mentionCheck(ev.target); });
for (const type of ['change', 'input']) document.addEventListener(type, ev => {
  const el = ev.target.closest?.('[data-ch]'); if (!el) return;
  const fn = CH[el.dataset.ch]; if (!fn) return;
  const isText = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|)$/.test(el.type) && el.inputMode !== 'numeric');
  if (type === 'input' && !isText && el.dataset.ch !== 'amt') return; // selects/dates/checkboxes: change only
  if (type === 'change' && (isText || el.dataset.ch === 'amt')) return;
  fn(el, ev);
});
document.addEventListener('paste', ev => {
  if (S.view !== 'chat' || !S.me || dlg().open) return;
  const files = [...(ev.clipboardData?.files || [])]; if (files.length) { ev.preventDefault(); addPending(files); }
});
document.addEventListener('dragover', ev => { if (S.view === 'chat' && S.me) ev.preventDefault(); });
document.addEventListener('drop', ev => { if (S.view === 'chat' && S.me && ev.dataTransfer?.files?.length) { ev.preventDefault(); addPending([...ev.dataTransfer.files]); } });
let swipeX = null; // swipe the calendar to change month
document.addEventListener('touchstart', ev => { swipeX = ev.target.closest?.('#cal-days') ? [ev.touches[0].clientX, ev.touches[0].clientY] : null; }, { passive: true });
document.addEventListener('touchend', ev => { if (!swipeX) return; const dx = ev.changedTouches[0].clientX - swipeX[0], dy = ev.changedTouches[0].clientY - swipeX[1]; swipeX = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) A.remMon({ dataset: { n: dx < 0 ? 1 : -1 } }); }, { passive: true });

document.addEventListener('submit', async ev => {
  const f = ev.target; if (f.closest('#cfm')) return; ev.preventDefault();
  if (f.id === 'login-form') {
    const b = $('#l-btn'); b.disabled = true; b.textContent = 'Masuk…'; $('#l-err').textContent = '';
    try { await login($('#l-user').value, $('#l-pass').value, $('#l-rem').checked); } catch (e) { b.disabled = false; b.textContent = 'Masuk'; $('#l-err').textContent = e.message; $('#l-pass').select(); }
  } else if (f.id === 'rem-add') {
    const title = $('#ra-title').value.trim(); if (!title) return;
    const btn = $('#ra-btn'); let files = [];
    if (PF.ra?.length) { btn.disabled = true; btn.textContent = 'Upload…'; try { files = await pfUpload('ra'); } catch (e) { toast('Upload gagal: ' + esc(e.message), 'warn'); btn.disabled = false; btn.textContent = 'Tambah'; return; } }
    create('reminder', { title, date: $('#ra-date').value || today(), time: $('#ra-time').value, color: $('#ra-color').value, note: $('#ra-note').value.trim(), done: false, doneBy: '', doneAt: 0, ...(files.length ? { files } : {}) }, { quiet: 1 });
    $('#ra-title').value = ''; $('#ra-note').value = ''; $('#ra-time').value = ''; renderMain(); $('#ra-title').focus();
    toast('Reminder ditambahkan.', 'info', null, 2000);
  } else if (f.id === 'rem-edit') {
    const btn = $('button[type=submit]', f); let files = [];
    if (PF.re?.length) { btn.disabled = true; btn.textContent = 'Upload…'; try { files = await pfUpload('re'); } catch (e) { toast('Upload gagal: ' + esc(e.message), 'warn'); btn.disabled = false; btn.textContent = 'Simpan'; return; } }
    patch(f.dataset.id, { title: $('#re-title').value.trim(), date: $('#re-date').value, time: $('#re-time').value, color: $('input[name=re-color]:checked', f)?.value || 'blue', note: $('#re-note').value.trim(), files: [...(S.dlg?.rfiles || []), ...files] }); closeAll();
  } else if (f.id === 'composer') sendMsg();
  else if (f.id === 'link-add') {
    const url = normUrl($('#lk-url').value); if (!/^https?:\/\/[^\s]+\.[^\s]+/.test(url)) { toast('Link tidak valid.', 'warn'); return; }
    create('link', { url, title: $('#lk-title').value.trim() }); $('#lk-url').value = ''; $('#lk-title').value = ''; renderMain();
  } else if (f.id === 'task-form') {
    const id = S.dlg?.id, t = id ? S.items.get(id) : null, v = readTaskForm();
    if (v.routine.on && !v.routine.days.length) { toast('Pilih hari untuk pekerjaan rutin.', 'warn'); return; }
    if (!v.title && !v.body.trim() && !v.items.length) { toast('Task masih kosong.', 'warn'); return; }
    if (!t) create('task', { ...v, statusBy: S.me.name, statusAt: srvNow(), archived: false });
    else if (canEdit(t)) put({ ...t, data: { ...t.data, ...v, ...(v.status !== t.data.status ? { statusBy: S.me.name, statusAt: srvNow() } : {}) } });
    else { // non-owner: only status + checklist ticks
      const p = { items: (t.data.items || []).map((x, i) => ({ ...x, d: $$('.cli-ed .tf-d', f)[i]?.checked ?? x.d })) };
      if (v.status !== t.data.status) Object.assign(p, { status: v.status, statusBy: S.me.name, statusAt: srvNow() });
      patch(t.id, p);
    }
    closeAll(); toast(t ? 'Task disimpan.' : 'Task dibuat.', 'info', null, 2000);
  } else if (f.id === 'cash-form') {
    const amount = parseNum($('#cf-amt').value), cat = $('#cf-cat').value, type = $('input[name=cf-type]:checked', f).value;
    if (!amount) { toast('Isi jumlah uang.', 'warn'); return; }
    const btn = $('#cf-save'); btn.disabled = true; btn.textContent = 'Menyimpan…';
    let file = S.dlg.file;
    try { if (S.dlg.newFile) file = await uploadFile(S.dlg.newFile); } catch (e) { toast('Upload bukti gagal: ' + esc(e.message), 'warn'); btn.disabled = false; btn.textContent = 'Simpan'; return; }
    const data = { type, cat, amount, date: $('#cf-date').value || today(), note: $('#cf-note').value.trim(), ...(file ? { file } : {}) };
    const t = S.dlg.id ? S.items.get(S.dlg.id) : null;
    if (t) put({ ...t, data }); else create('cash', data);
    closeAll(); toast(`${type === 'in' ? 'Uang masuk' : 'Uang keluar'} ${money(amount)} · ${esc(catName(cat))} — sisa ${money(catTotals(cat).close)}`, 'info', null, 4000);
  } else if (f.id === 'unit-form') { saveUnitForm(f);
  } else if (f.id === 'stok-form') { saveStokForm(f);
  } else if (f.id === 'cat-form') {
    const name = $('#kc-name').value.trim(); if (!name) return;
    const data = { name, color: $('input[name=kc-color]:checked', f)?.value || 'green', note: $('#kc-note').value.trim(), archived: !!$('#kc-arch')?.checked };
    const c = S.dlg.id ? S.items.get(S.dlg.id) : null;
    if (c) put({ ...c, data: { ...c.data, ...data } }); else create('cashcat', data);
    closeAll();
  } else if (f.id === 'pf-form') {
    try { const r = await rpc('ahg_profile', { p_token: S.token, p_display: $('#pf-disp').value, p_color: $('input[name=pf-color]:checked', f)?.value || '' }); if (r?.ok) { S.me = r.me; toast('Profil disimpan.', 'info', null, 2000); ping(); await syncNow(); render(); profileDialog(); } } catch (e) { toast('Gagal: ' + esc(e.message), 'warn'); }
  } else if (f.id === 'pw-form') {
    const n1 = $('#pw-new').value, n2 = $('#pw-new2').value, err = $('#pw-err'); err.textContent = '';
    if (n1 !== n2) { err.textContent = 'Password baru tidak sama.'; return; }
    try { const r = await rpc('ahg_pass', { p_token: S.token, p_old: $('#pw-old').value, p_new: n1 }); if (!r?.ok) { err.textContent = r?.err === 'wrong' ? 'Password lama salah.' : r?.err === 'pass' ? 'Password baru minimal 4 karakter.' : 'Gagal.'; return; } f.reset(); toast('Password diganti.', 'info'); }
    catch (e) { err.textContent = 'Gagal: ' + e.message; }
  }
});
for (const id of ['dlg', 'viewer']) document.getElementById(id).addEventListener('click', ev => { if (ev.target === ev.currentTarget) ev.currentTarget.close(); });
dlg().addEventListener('close', () => { S.dlg = null; dlg().className = ''; });

// ---------- loops + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build when nothing is being edited
  if (dlg().open || S.queue.size || document.activeElement?.value) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1]); }
  } catch {}
}
setInterval(tickClock, 1000);
let lastPoll = 0;
setInterval(() => { if (!S.token) return; const gap = document.hidden ? 30000 : 12000; if (Date.now() - lastPoll >= gap) { lastPoll = Date.now(); syncNow(); } }, 3000);
setInterval(() => checkDue(), 30000);
setInterval(checkUpdate, 10 * 60e3);
setInterval(() => { if (S.me && !dlg().open && !document.activeElement?.matches?.('input,textarea,select')) render(); }, 60000); // refresh "x mnt lalu"
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) { syncNow(); if (S.view === 'chat') markRead(); } });
window.addEventListener('pagehide', () => { if (W.saveT) gameFlush(); if (S.token) rpc('ahg_away', { p_token: S.token, p_logout: false }, { keepalive: true, once: true }).catch(() => {}); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || SS.get('session') || 'null'); } catch {}
  if (s?.token && s?.name) { S.token = s.token; S.me = { name: s.name, role: s.name === 'admin' ? 'admin' : 'user', display: s.name }; start(); }
  else render();
}
boot();
