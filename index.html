<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones: whole app at 81% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.81, minimum-scale=0.81, maximum-scale=0.81, viewport-fit=cover';
try { const t = JSON.parse(localStorage.getItem('ahg.theme') || '{}'); if (t.mode && t.mode !== 'auto') document.documentElement.dataset.theme = t.mode; if (t.accent) document.documentElement.style.setProperty('--acc', t.accent); } catch {}</script>
<title>Virtual Work AHG</title>
<meta name="description" content="Virtual Work AHG — reminder, global chat, task dan kasbon tim, sinkron real time di HP dan laptop.">
<meta name="theme-color" content="#1a8566">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231a8566'/><text x='50' y='63' font-family='Arial' font-weight='700' font-size='34' fill='white' text-anchor='middle'>AHG</text></svg>">
<style>:root{--acc:#1a8566;--bg:#f4f6f5;--card:#fff;--soft:#eef1ef;--line:#dfe4e1;--text:#16191a;--muted:#5f6b67;--red:#d93d42;--green:#15803d;--warn:#b45309;--na:60%;--shadow:0 1px 2px rgba(10,30,20,.05),0 4px 14px rgba(10,30,20,.05);--acc-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1312;--card:#181d1c;--soft:#212826;--line:#2c3532;--text:#eef3f1;--muted:#9fb0aa;--red:#ff6b70;--green:#4ade80;--warn:#fbbf24;--na:26%;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1312;--card:#181d1c;--soft:#212826;--line:#2c3532;--text:#eef3f1;--muted:#9fb0aa;--red:#ff6b70;--green:#4ade80;--warn:#fbbf24;--na:26%;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}
input:disabled,select:disabled,textarea:disabled{opacity:.75}
textarea{resize:vertical}
a{color:var(--acc)}
h1,h2,h3{letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.danger-f{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px;font-size:16px}
.btn.in-b{color:var(--green)}.btn.out-b{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:13px}
.err{color:var(--red);font-weight:600;min-height:1.2em;margin:0;font-size:14px}
.warn-t{color:var(--warn);font-weight:600}
.ib{border:0;background:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;color:var(--muted);padding:0;flex:none}
.ib:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.ib.on{color:#f0a020}
.ib.big{font-size:26px;width:40px;height:40px;color:var(--text)}
.ib.sm{width:26px;height:26px;font-size:13px}
.mini{border:0;background:none;color:var(--acc);font-weight:700;font-size:12px;cursor:pointer;padding:0 4px}
.sp{flex:1}
.full{width:100%}
.chk-l{display:flex!important;align-items:center;gap:8px;flex-direction:row!important;font-weight:500!important;cursor:pointer}
.chk-l input{width:18px;height:18px;accent-color:var(--acc)}
/* avatars */
.av{--av:#1a8566;width:32px;height:32px;border-radius:50%;background:var(--av);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none;line-height:1}
.av.xs{width:18px;height:18px;font-size:10px;vertical-align:-4px}
.av.xl{width:56px;height:56px;font-size:24px}
.av.gl{background:color-mix(in srgb,var(--acc) 18%,var(--card));font-size:16px}
.avw{position:relative;display:inline-flex;flex:none}
.st{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#9aa5a1;border:2px solid var(--card)}
.st.on{background:#22c55e}
.on-t{color:#16a34a;font-weight:700}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),var(--bg)}
.lcard{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.lcard label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.lcard input{padding:11px 13px;font-size:16px}
.lbrand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.lbrand h1{margin:0;font-size:24px}.lbrand p{margin:2px 0 0;font-size:14px}
.pw{display:flex;align-items:center;gap:4px}.pw input{flex:1}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.02em;flex:none}
.logo.big{width:56px;height:56px;border-radius:16px;font-size:18px}
/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "side main users";min-height:100dvh}
.top{grid-area:top;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:8px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.clock{display:flex;flex-direction:column;line-height:1.15;min-width:190px}
.clock b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--acc)}
.clock span{font-size:12.5px;color:var(--muted);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin:0 auto 0 0}
.top-r{display:flex;align-items:center;gap:12px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--warn)}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600}
.me-btn:hover{background:var(--soft)}
.me-btn small{font-size:10.5px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:99px;padding:1px 6px;margin-left:2px}
.caret{color:var(--muted);font-size:12px}
.side{grid-area:side;position:sticky;top:61px;align-self:start;height:calc(100dvh - 61px);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text);font-weight:600;font-size:15px}
.nav:hover{background:var(--soft)}
.nav.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.nav .ic{width:22px;text-align:center;font-size:18px}
.nav .lb{flex:1}
.n{font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;background:var(--soft);color:var(--muted)}
.n.hot{background:var(--red);color:#fff}
.n.grn{background:color-mix(in srgb,#22c55e 20%,transparent);color:#16a34a}
.side-f{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:2px}
.nv-users{display:none}
main{grid-area:main;min-width:0;padding:18px 24px 100px}
.upanel{grid-area:users;position:sticky;top:61px;align-self:start;height:calc(100dvh - 61px);overflow:auto;border-left:1px solid var(--line);padding:14px 12px}
.up-h{display:flex;flex-direction:column;padding:2px 6px 10px}
.up-h b{font-size:15px}
.up-f{padding:6px}
.ulist{display:flex;flex-direction:column;gap:2px}
.ulist.big{padding:6px}
.urow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer}
.urow:hover{background:var(--soft)}
.urow.me{cursor:default;background:none}
.ui{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.ui b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui small{font-size:12px;color:var(--muted)}
.ui small b,.adm{font-size:10.5px}
.adm{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:99px;padding:1px 6px}
.wh{opacity:0;font-size:14px}
.urow:hover .wh{opacity:.8}
.bnav{display:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font-size:24px}
.hc{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);margin:36px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--text)}
.chip small{color:var(--muted);font-weight:700}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc)}
.chip-sel{border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
/* reminder */
.hb-tog{display:flex;align-items:center;width:100%;border:0;background:none;cursor:pointer;padding:6px 0;margin:0 0 10px;color:var(--muted)}
.hb-tog::before,.hb-tog::after{content:'';flex:1;height:1px;background:var(--line)}
.hb-tog span{padding:0 14px;font-size:18px;line-height:1;font-weight:700}
.hb-tog:hover{color:var(--acc)}
.hb-tog:hover::before,.hb-tog:hover::after{background:color-mix(in srgb,var(--acc) 50%,var(--line))}
.cal{padding:12px 14px 14px;margin-bottom:14px}
.cal-h{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.cal-t{display:flex;gap:6px}
.cal-t select{font-weight:700;font-size:16px;border-color:transparent;background:var(--soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-g.wk span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-g.wk span:last-child{color:var(--red)}
.day{position:relative;min-height:96px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;color:var(--text);overflow:hidden;min-width:0}
.day:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.day.out{opacity:.45}
.day.sun .dn{color:var(--red)}
.day .dn{font-weight:700;font-size:13.5px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--acc);color:#fff}
.day.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.dots{display:none;gap:3px;flex-wrap:wrap;align-items:center;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dots i.dn-ok{background:none;border:1.5px solid var(--c)}
.dots em{font-size:9px;font-style:normal;color:var(--muted);font-weight:700}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{font-size:11.5px;line-height:1.3;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.ok{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);font-weight:600}
.qadd{display:grid;grid-template-columns:minmax(0,2.2fr) 150px 110px 120px minmax(0,1.6fr) auto;gap:8px;padding:10px;margin-bottom:14px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{--c:#3b82f6;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.rrow.done{opacity:.72}
.rrow.done .rt{text-decoration:line-through}
.rchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:none;cursor:pointer;flex:none;color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;margin-top:1px}
.rrow.done .rchk{background:var(--c)}
.rb{flex:1;min-width:0}
.rt{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.rn{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:color-mix(in srgb,var(--text) 82%,transparent);margin-top:2px}
.rm{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.rm b{color:var(--text)}
.due{font-weight:700;color:var(--text)}
.due.late{color:var(--red)}
.okm{color:var(--green)}
.ra{display:flex;gap:0}
/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(860px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,15,10,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.dlg h3{margin:0 0 6px;font-size:15px}
.dlg label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
.dlg p{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.swatches,.colors{display:flex;gap:8px;flex-wrap:wrap}
.sw{cursor:pointer;display:inline-flex!important}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid color-mix(in srgb,var(--text) 15%,transparent);display:block}
.sw.note i[style*=transparent]{background:linear-gradient(135deg,transparent 45%,var(--red) 46%,var(--red) 54%,transparent 55%)}
.sw input:checked+i{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{flex:1;display:block!important;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:9px 6px;font-weight:700}
.seg input:checked+span{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.seg input:checked+span.in{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.seg input:checked+span.out{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.ed-bar{display:flex;align-items:center;gap:4px}
.ed-bar b{font-size:16px}
/* chat */
.chat{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;height:calc(100dvh - 61px - 36px - 40px)}
main[data-view=chat]{padding-bottom:18px}
.convs{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.cv-h{padding:12px 14px 6px}
.cv-l{flex:1;overflow:auto;padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.conv{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text)}
.conv:hover{background:var(--soft)}
.conv.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.cn{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cn small{font-weight:500;color:var(--muted);font-size:11.5px}
.cv-new{display:flex;flex-direction:column;gap:4px;padding:10px;border-top:1px solid var(--line);font-weight:700;font-size:12.5px}
.cpane{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.c-h{display:flex;flex-direction:column;padding:10px 16px;border-bottom:1px solid var(--line)}
.c-h b{font-size:16px}
.m-conv{display:none}
.c-list{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--soft) 50%,var(--card))}
.c-list .more{align-self:center;margin-bottom:8px}
.dsep{text-align:center;margin:12px 0 6px}
.dsep span{font-size:12px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(680px,88%);margin-top:6px}
.msg.cont{margin-top:0}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.mav{width:32px;flex:none}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:7px 11px 5px;min-width:0;box-shadow:var(--shadow)}
.msg.mine .bub{background:color-mix(in srgb,var(--acc) 14%,var(--card));border-color:color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:16px 16px 4px 16px}
.msg.wh .bub{border-style:dashed;border-color:#8b5cf6;background:color-mix(in srgb,#8b5cf6 9%,var(--card))}
.mh{font-size:12.5px;margin-bottom:1px}
.whl{color:#8b5cf6;font-weight:700;font-size:11.5px}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.mdel{border:0;background:none;cursor:pointer;font-size:11px;opacity:0;padding:0}
.msg:hover .mdel{opacity:.7}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.att-img{border:0;padding:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden}
.att-img img{display:block;max-width:240px;max-height:200px;border-radius:10px}
.att-file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;max-width:280px;color:var(--text)}
.att-file:hover{border-color:var(--acc)}
.fi{font-size:22px}
.fn{display:flex;flex-direction:column;font-size:13px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.fn small{font-weight:500;color:var(--muted)}
.composer{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.composer.whm{background:color-mix(in srgb,#8b5cf6 7%,var(--card))}
.wh-bar{font-size:12.5px;color:#7c3aed;font-weight:600}
.pend{display:flex;flex-wrap:wrap;gap:6px}
.pend:empty{display:none}
.pf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 6px;font-size:12.5px;background:var(--card);max-width:100%}
.pf img{width:30px;height:30px;object-fit:cover;border-radius:6px}
.pf .ib{width:24px;height:24px;font-size:12px}
.c-row{display:flex;align-items:flex-end;gap:4px}

<script>// ---------- Excel (.xlsx) + PDF writers (from Saku.yuk, no libraries) ----------
const XLSX = {
  _crc: null,
  crc32(u8) { if (!XLSX._crc) { XLSX._crc = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; XLSX._crc[n] = c >>> 0; } }

  zip(files) {
    const enc = new TextEncoder(); const parts = [], central = []; let off = 0; const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {

      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      parts.push(new Uint8Array(h.buffer), name, data); central.push(new Uint8Array(c.buffer), name); off += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((a, x) => a + x.length, 0); const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);

function catTotals(catId, from, to) { // from/to ymd, to exclusive; returns {open, in, out, close, n}
  let open = 0, inn = 0, out = 0, n = 0;
  for (const t of cashTx()) {
    if (catId && t.data.cat !== catId) continue;
    const v = t.data.type === 'in' ? t.data.amount : -t.data.amount;
    if (from && t.data.date < from) { open += v; continue; }
    if (to && t.data.date >= to) continue;
    n++; if (v > 0) inn += v; else out -= v;
  }
  return { open, in: inn, out, close: open + inn - out, n };
}
function periodRange(p, ref, from, to) { // → [start, end) as ymd, '' = open
  const d = pYmd(ref || today());
  if (p === 'week') { const s = weekStart(d); return [ymd(s), ymd(addDays(s, 7))]; }
  if (p === 'month') return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1))];
  if (p === 'year') return [`${d.getFullYear()}-01-01`, `${d.getFullYear() + 1}-01-01`];
  if (p === 'range') return [from || '', to ? ymd(addDays(pYmd(to), 1)) : ''];
  return ['', ''];
}

  remMon: el => { const d = new Date(S.rem.y, S.rem.m + Number(el.dataset.n), 1); S.rem.y = d.getFullYear(); S.rem.m = d.getMonth(); S.rem.sel = ''; S.rem.addDate = ''; renderMain(); },
  remToday: () => { const n = new Date(); S.rem.y = n.getFullYear(); S.rem.m = n.getMonth(); S.rem.sel = today(); S.rem.addDate = ''; renderMain(); },
  remDay: el => { const d = el.dataset.d; S.rem.sel = S.rem.sel === d ? '' : d; S.rem.addDate = ''; const p = pYmd(d); if (p.getMonth() !== S.rem.m) { S.rem.m = p.getMonth(); S.rem.y = p.getFullYear(); } renderMain(); },
  calTog: () => { S.rem.cal = !S.rem.cal; renderMain(); },
  remSt: el => { S.rem.st = el.dataset.k; renderMain(); },
  remDone: el => { const r = S.items.get(el.dataset.id); if (!r) return; const done = !r.data.done; patch(r.id, { done, doneBy: done ? S.me.name : '', doneAt: done ? srvNow() : 0 }); },
  remEdit: el => remDialog(S.items.get(el.dataset.id)),
  remDel: async el => { const r = S.items.get(el.dataset.id); if (r && await confirmDlg(`Hapus reminder <b>${esc(r.data.title)}</b>?`, 'Hapus')) { closeAll(); remove(r.id); } },
  // chat
  conv: el => { S.chat.conv = el.dataset.c; S.chat.limit = 200; renderMain(); markRead(); renderNav(); $('#c-text')?.focus(); },
  chatMore: () => { S.chat.limit += 300; renderMain(); },
  msgDel: async el => { if (await confirmDlg('Hapus pesan ini untuk semua orang?', 'Hapus')) remove(el.dataset.id); },
  pendDel: el => { S.chat.files.splice(Number(el.dataset.i), 1); $('#pend').innerHTML = pendHtml(); },
  whPick: () => { const s = $('#wh-new'); if (s && s.offsetParent) { s.focus(); try { s.showPicker?.(); } catch {} } else { const m = $('#m-conv'); m.value = '+'; m.dispatchEvent(new Event('change', { bubbles: true })); } },
  // task
  taskNew: el => openTask(null, { routine: el.dataset.routine === '1' || S.task.tab === 'routine' }),
  taskOpen: el => openTask(el.dataset.id),
  linksTog: () => { S.task.links = !S.task.links; renderMain(); },
  taskTab: el => { S.task.tab = el.dataset.k; renderMain(); },
  taskLayout: () => { S.task.layout = S.task.layout === 'grid' ? 'list' : 'grid'; LS.set('task.layout', S.task.layout); renderMain(); },
  taskPin: el => { const id = el.dataset.id, P = pins(); savePref({ pins: P.includes(id) ? P.filter(x => x !== id) : [...P, id] }); render(); if (S.dlg?.type === 'task') { el.classList.toggle('on'); el.textContent = el.classList.contains('on') ? '★' : '☆'; } },
  taskStatus: el => { const t = S.items.get(el.dataset.id); const nx = { todo: 'doing', doing: 'done', done: 'todo' }[t.data.status || 'todo']; patch(t.id, { status: nx, statusBy: S.me.name, statusAt: srvNow() }); toast(`Status “${esc(t.data.title || 'Tanpa judul')}” → ${STATUS[nx][0]}`, 'info', null, 2500); },
  taskItem: el => { const t = S.items.get(el.dataset.id), items = (t.data.items || []).map((x, i) => i === Number(el.dataset.i) ? { ...x, d: !x.d } : x); patch(t.id, { items }); },
  taskDel: async el => { const t = S.items.get(el.dataset.id); if (await confirmDlg(`Hapus task <b>${esc(t.data.title || 'Tanpa judul')}</b> beserta komentarnya?`, 'Hapus')) { closeAll(); comments(t.id).forEach(c => remove(c.id)); remove(t.id); } },
  taskArch: el => { const t = S.items.get(el.dataset.id); patch(t.id, { archived: !t.data.archived }); closeAll(); toast(t.data.archived ? 'Task dikeluarkan dari arsip.' : 'Task diarsipkan.', 'info', null, 2500); },
  clAdd: () => { const box = $('#tf-items'); box.insertAdjacentHTML('beforeend', clRow({ t: '', d: false }, 0, false)); $$('.tf-t', box).at(-1).focus(); },
  clDel: el => el.closest('.cli-ed').remove(),
  cmtAdd: el => { const t = $('#cm-text'), v = t.value.trim(); if (!v) return; create('comment', { task: el.dataset.id, text: v.slice(0, 5000) }); t.value = ''; refreshDialog(); },
  cmtDel: async el => { if (await confirmDlg('Hapus komentar ini?', 'Hapus')) { remove(el.dataset.id); refreshDialog(); } },
  routineCk: el => { const id = ckId(el.dataset.id, el.dataset.d), c = S.items.get(id), on = !(c && !c.deleted && c.data.on);
    if (c) put({ ...c, deleted: false, data: { ...c.data, on, by: S.me.name, at: srvNow() } }); else put({ id, kind: 'check', owner: S.me.name, to: null, data: { task: el.dataset.id, date: el.dataset.d, on: true, by: S.me.name, at: srvNow() }, created: 0, updated: 0, deleted: false }); },
  weekNav: el => { const n = Number(el.dataset.n); S.task.week = n === 0 ? 0 : S.task.week + n; renderMain(); },
  linkDel: async el => { const l = S.items.get(el.dataset.id); if (await confirmDlg(`Hapus link <b>${esc(l.data.title || l.data.url)}</b>?`, 'Hapus')) remove(l.id); },
  // cash
  cashNew: el => cashDialog(null, el.dataset.t),
  cashEdit: el => cashDialog(S.items.get(el.dataset.id)),
  cashCat: el => { S.cash.cat = S.cash.cat === el.dataset.id ? '' : el.dataset.id; renderMain(); },
  catNew: () => catDialog(),
  catEdit: (el, ev) => { ev.stopPropagation(); catDialog(S.items.get(el.dataset.id)); },
  catDel: async el => { const c = S.items.get(el.dataset.id), n = live('cash').filter(t => t.data.cat === c.id).length;
    if (n) { toast(`Kategori masih punya ${n} transaksi. Hapus/pindahkan transaksinya dulu, atau arsipkan kategorinya.`, 'warn', null, 8000); return; }
    if (await confirmDlg(`Hapus kategori <b>${esc(c.data.name)}</b>?`, 'Hapus')) { closeAll(); remove(c.id); if (S.cash.cat === c.id) S.cash.cat = ''; } },
  cashNav: el => { S.cash.ref = shiftRef(S.cash.p, S.cash.ref, Number(el.dataset.n)); renderMain(); },
  cashDel: async el => { const t = S.items.get(el.dataset.id); if (await confirmDlg(`Hapus transaksi ${money(t.data.amount)} <b>${esc(t.data.note || '')}</b>?`, 'Hapus')) { closeAll(); remove(t.id); } },
  report: () => reportDialog(),
  repPdf: () => reportPdf(), repXlsx: () => reportXlsx(), repPrint: () => reportPrint(),
  // admin
  admReset: async el => { const n = el.dataset.u; if (await confirmDlg(`Reset password <b>${esc(n)}</b>? User akan keluar dari semua perangkat; login berikutnya dengan password apa pun menjadi password barunya.`, 'Reset')) adminAct('reset', n); },
  admDel: async el => { const n = el.dataset.u; const r = await confirmDlg(`Hapus user <b>${esc(n)}</b>? Akun & sesi dihapus (nama bisa dipakai daftar lagi).`, 'Hapus user', true, `<label class="chk-l"><input type="checkbox" id="cf-purge"> Hapus juga semua data buatannya (reminder, task, cash, pesan)</label>`); if (r) adminAct('delete', n, $('#cf-purge')?.checked); }
};
const CH = { // change / input handlers
  remM: el => { S.rem.m = Number(el.value); S.rem.sel = ''; renderMain(); },
  remY: el => { S.rem.y = Number(el.value); S.rem.sel = ''; renderMain(); },
  remScope: el => { S.rem.scope = el.value; renderMain(); },
  remWho: el => { S.rem.who = el.value; renderMain(); },
  raDate: el => { S.rem.addDate = el.value; },
  convSel: el => { if (el.value === '+') { const others = S.users.filter(u => u.name !== S.me.name); pickUser(others); return; } S.chat.conv = el.value; renderMain(); markRead(); renderNav(); },
  whNew: el => { if (el.value) { S.chat.conv = 'w:' + el.value; renderMain(); markRead(); $('#c-text')?.focus(); } },
  cFile: el => { addPending([...el.files]); el.value = ''; },
  cText: (el, ev) => { if (ev.type === 'input') autoGrow(el); },
  taskQ: (el, ev) => { if (ev.type === 'input') { S.task.q = el.value; renderMain(); } },
  taskTabSel: el => { S.task.tab = el.value; renderMain(); },
  taskWho: el => { S.task.who = el.value; renderMain(); },
  cashCatSel: el => { S.cash.cat = el.value; renderMain(); },
  cashP: el => { S.cash.p = el.value; S.cash.ref = today(); renderMain(); },
  cashFrom: el => { S.cash.from = el.value; renderMain(); }, cashTo: el => { S.cash.to = el.value; renderMain(); },
  cashWho: el => { S.cash.who = el.value; renderMain(); },
  cashQ: (el, ev) => { if (ev.type === 'input') { S.cash.q = el.value; renderMain(); } },
  amt: (el, ev) => { if (ev.type !== 'input') return; const n = parseNum(el.value); el.value = n ? num(n) : ''; },
  cfFile: async el => { const f = el.files[0]; if (!f) return; try { S.dlg.newFile = await prepFile(f); $('#cf-fname').textContent = '📎 ' + S.dlg.newFile.name + ' (' + fsize(S.dlg.newFile.size) + ')'; } catch (e) { toast(esc(e.message), 'warn'); el.value = ''; } },
  repCat: el => { S.rep.cat = el.value; repRefresh(); }, repP: el => { S.rep.p = el.value; S.rep.ref = today(); repRefresh(); },
  repRef: el => { const v = el.value; if (!v) return; S.rep.ref = S.rep.p === 'month' ? v + '-01' : S.rep.p === 'year' ? (v.length === 4 ? v + '-01-01' : S.rep.ref) : v; repRefresh(); },
  repFrom: el => { S.rep.from = el.value; repRefresh(); }, repTo: el => { S.rep.to = el.value; repRefresh(); },
  tfColor: el => { const f = $('#task-form'), c = NOTE_COLORS[el.value]?.[1]; f.classList.toggle('col', !!el.value); f.style.setProperty('--nc', c || 'transparent'); },
  thMode: el => setTheme({ mode: el.value }), thAcc: el => setTheme({ accent: el.value }), thScale: el => setTheme({ scale: Number(el.value) }),
  npSound: el => LS.set('notify', JSON.stringify({ ...notifyPref(), sound: el.checked })),
  npRem: el => LS.set('notify', JSON.stringify({ ...notifyPref(), rem: el.value })),
  npBrowser: async el => {
    if (el.checked) {
      if (!('Notification' in window)) { toast('Browser ini tidak mendukung notifikasi.', 'warn'); el.checked = false; return; }
      const p = await Notification.requestPermission(); if (p !== 'granted') { toast('Izin notifikasi ditolak browser.', 'warn'); el.checked = false; return; }
    }
    LS.set('notify', JSON.stringify({ ...notifyPref(), browser: el.checked }));
  }
};
function repRefresh() { const b = $('#rep-body'); if (b) b.innerHTML = reportBody(); }
async function pickUser(list) {
  const r = await confirmDlg('🤫 Whisper ke siapa?', 'Mulai whisper', false, `<select id="pk-user" class="full">${list.map(u => `<option value="${esc(u.name)}">${esc(uname(u.name))} (@${esc(u.name)})</option>`).join('')}</select>`);
  const v = r ? $('#pk-user').value : ''; if (v) { S.chat.conv = 'w:' + v; markRead(); } renderMain(); renderNav();
}

// ---------- events ----------
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'A' && el.dataset.a === 'stop') return;
  const a = ev.target.closest('a[href]'); if (a && a !== el && el.contains(a)) return; // links inside cards open normally
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.closest('.ncard') && el !== el.closest('.ncard')) ev.stopPropagation();
  ev.preventDefault(); fn(el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches?.('.ncard')) A.taskOpen(ev.target);
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.target.id === 'c-text' && !matchMedia('(pointer:coarse)').matches) { ev.preventDefault(); sendMsg(); }
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.id === 'cm-text') { ev.preventDefault(); $('[data-a=cmtAdd]')?.click(); }
});
for (const type of ['change', 'input']) document.addEventListener(type, ev => {
  const el = ev.target.closest?.('[data-ch]'); if (!el) return;
  const fn = CH[el.dataset.ch]; if (!fn) return;
  const isText = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|)$/.test(el.type) && el.inputMode !== 'numeric');
  if (type === 'input' && !isText && el.dataset.ch !== 'amt') return; // selects/dates/checkboxes: change only
  if (type === 'change' && (isText || el.dataset.ch === 'amt')) return;
  fn(el, ev);
});
document.addEventListener('paste', ev => {
  if (S.view !== 'chat' || !S.me || dlg().open) return;
  const files = [...(ev.clipboardData?.files || [])]; if (files.length) { ev.preventDefault(); addPending(files); }
});
document.addEventListener('dragover', ev => { if (S.view === 'chat' && S.me) ev.preventDefault(); });
document.addEventListener('drop', ev => { if (S.view === 'chat' && S.me && ev.dataTransfer?.files?.length) { ev.preventDefault(); addPending([...ev.dataTransfer.files]); } });
let swipeX = null; // swipe the calendar to change month
document.addEventListener('touchstart', ev => { swipeX = ev.target.closest?.('#cal-days') ? [ev.touches[0].clientX, ev.touches[0].clientY] : null; }, { passive: true });
document.addEventListener('touchend', ev => { if (!swipeX) return; const dx = ev.changedTouches[0].clientX - swipeX[0], dy = ev.changedTouches[0].clientY - swipeX[1]; swipeX = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) A.remMon({ dataset: { n: dx < 0 ? 1 : -1 } }); }, { passive: true });

document.addEventListener('submit', async ev => {
  const f = ev.target; if (f.closest('#cfm')) return; ev.preventDefault();
  if (f.id === 'login-form') {
    const b = $('#l-btn'); b.disabled = true; b.textContent = 'Masuk…'; $('#l-err').textContent = '';
    try { await login($('#l-user').value, $('#l-pass').value, $('#l-rem').checked); } catch (e) { b.disabled = false; b.textContent = 'Masuk'; $('#l-err').textContent = e.message; $('#l-pass').select(); }
  } else if (f.id === 'rem-add') {
    const title = $('#ra-title').value.trim(); if (!title) return;
    create('reminder', { title, date: $('#ra-date').value || today(), time: $('#ra-time').value, color: $('#ra-color').value, note: $('#ra-note').value.trim(), done: false, doneBy: '', doneAt: 0 }, { quiet: 1 });
    $('#ra-title').value = ''; $('#ra-note').value = ''; $('#ra-time').value = ''; renderMain(); $('#ra-title').focus();
    toast('Reminder ditambahkan.', 'info', null, 2000);
  } else if (f.id === 'rem-edit') {
    patch(f.dataset.id, { title: $('#re-title').value.trim(), date: $('#re-date').value, time: $('#re-time').value, color: $('input[name=re-color]:checked', f)?.value || 'blue', note: $('#re-note').value.trim() }); closeAll();
  } else if (f.id === 'composer') sendMsg();
  else if (f.id === 'link-add') {
    const url = normUrl($('#lk-url').value); if (!/^https?:\/\/[^\s]+\.[^\s]+/.test(url)) { toast('Link tidak valid.', 'warn'); return; }
    create('link', { url, title: $('#lk-title').value.trim() }); $('#lk-url').value = ''; $('#lk-title').value = ''; renderMain();
  } else if (f.id === 'task-form') {
    const id = S.dlg?.id, t = id ? S.items.get(id) : null, v = readTaskForm();
    if (v.routine.on && !v.routine.days.length) { toast('Pilih hari untuk pekerjaan rutin.', 'warn'); return; }
    if (!v.title && !v.body.trim() && !v.items.length) { toast('Task masih kosong.', 'warn'); return; }
    if (!t) create('task', { ...v, statusBy: S.me.name, statusAt: srvNow(), archived: false });
    else if (canEdit(t)) put({ ...t, data: { ...t.data, ...v, ...(v.status !== t.data.status ? { statusBy: S.me.name, statusAt: srvNow() } : {}) } });
    else { // non-owner: only status + checklist ticks
      const p = { items: (t.data.items || []).map((x, i) => ({ ...x, d: $$('.cli-ed .tf-d', f)[i]?.checked ?? x.d })) };
      if (v.status !== t.data.status) Object.assign(p, { status: v.status, statusBy: S.me.name, statusAt: srvNow() });
      patch(t.id, p);
    }
    closeAll(); toast(t ? 'Task disimpan.' : 'Task dibuat.', 'info', null, 2000);
  } else if (f.id === 'cash-form') {
    const amount = parseNum($('#cf-amt').value), cat = $('#cf-cat').value, type = $('input[name=cf-type]:checked', f).value;
    if (!amount) { toast('Isi jumlah uang.', 'warn'); return; }
    const btn = $('#cf-save'); btn.disabled = true; btn.textContent = 'Menyimpan…';
    let file = S.dlg.file;
    try { if (S.dlg.newFile) file = await uploadFile(S.dlg.newFile); } catch (e) { toast('Upload bukti gagal: ' + esc(e.message), 'warn'); btn.disabled = false; btn.textContent = 'Simpan'; return; }
    const data = { type, cat, amount, date: $('#cf-date').value || today(), note: $('#cf-note').value.trim(), ...(file ? { file } : {}) };
    const t = S.dlg.id ? S.items.get(S.dlg.id) : null;
    if (t) put({ ...t, data }); else create('cash', data);
    closeAll(); toast(`${type === 'in' ? 'Uang masuk' : 'Uang keluar'} ${money(amount)} · ${esc(catName(cat))} — sisa ${money(catTotals(cat).close)}`, 'info', null, 4000);
  } else if (f.id === 'cat-form') {
    const name = $('#kc-name').value.trim(); if (!name) return;
    const data = { name, color: $('input[name=kc-color]:checked', f)?.value || 'green', note: $('#kc-note').value.trim(), archived: !!$('#kc-arch')?.checked };
    const c = S.dlg.id ? S.items.get(S.dlg.id) : null;
    if (c) put({ ...c, data: { ...c.data, ...data } }); else create('cashcat', data);
    closeAll();
  } else if (f.id === 'pf-form') {
    try { const r = await rpc('ahg_profile', { p_token: S.token, p_display: $('#pf-disp').value, p_color: $('input[name=pf-color]:checked', f)?.value || '' }); if (r?.ok) { S.me = r.me; toast('Profil disimpan.', 'info', null, 2000); ping(); await syncNow(); render(); profileDialog(); } } catch (e) { toast('Gagal: ' + esc(e.message), 'warn'); }
  } else if (f.id === 'pw-form') {
    const n1 = $('#pw-new').value, n2 = $('#pw-new2').value, err = $('#pw-err'); err.textContent = '';
    if (n1 !== n2) { err.textContent = 'Password baru tidak sama.'; return; }
    try { const r = await rpc('ahg_pass', { p_token: S.token, p_old: $('#pw-old').value, p_new: n1 }); if (!r?.ok) { err.textContent = r?.err === 'wrong' ? 'Password lama salah.' : r?.err === 'pass' ? 'Password baru minimal 4 karakter.' : 'Gagal.'; return; } f.reset(); toast('Password diganti.', 'info'); }
    catch (e) { err.textContent = 'Gagal: ' + e.message; }
  }
});
for (const id of ['dlg', 'viewer']) document.getElementById(id).addEventListener('click', ev => { if (ev.target === ev.currentTarget) ev.currentTarget.close(); });
dlg().addEventListener('close', () => { S.dlg = null; dlg().className = ''; });

// ---------- loops + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build when nothing is being edited
  if (dlg().open || S.queue.size || document.activeElement?.value) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1]); }
  } catch {}
}
setInterval(tickClock, 1000);
let lastPoll = 0;
setInterval(() => { if (!S.token) return; const gap = document.hidden ? 30000 : 12000; if (Date.now() - lastPoll >= gap) { lastPoll = Date.now(); syncNow(); } }, 3000);
setInterval(checkDue, 30000);
setInterval(checkUpdate, 10 * 60e3);
setInterval(() => { if (S.me && !dlg().open && !document.activeElement?.matches?.('input,textarea,select')) render(); }, 60000); // refresh "x mnt lalu"
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) { syncNow(); if (S.view === 'chat') markRead(); } });
window.addEventListener('pagehide', () => { if (S.token) rpc('ahg_away', { p_token: S.token, p_logout: false }, { keepalive: true, once: true }).catch(() => {}); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || SS.get('session') || 'null'); } catch {}
  if (s?.token && s?.name) { S.token = s.token; S.me = { name: s.name, role: s.name === 'admin' ? 'admin' : 'user', display: s.name }; start(); }
  else render();
}
boot();
</script>
